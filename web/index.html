<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Without® DPP Scanner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row text-center mb-5">
    <div class="col">
      <h1 class="display-5 fw-bold text-success">Without® DPP Scanner</h1>
      <p class="lead">Scan any bottle to verify sustainability, traceability, and impact.</p>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h5>Enter EPC Code</h5>
          <input type="text" id="epcInput" class="form-control mb-3" 
                 placeholder="urn:epc:id:sgtin:0614141.123456.0000000001">
          <button onclick="scanEPC()" class="btn btn-success w-100">Scan Bottle</button>
        </div>
      </div>
    </div>
  </div>

  <div id="result" class="mt-5"></div>
</div>

<script>
async function scanEPC() {
  const epc = document.getElementById('epcInput').value.trim();
  if (!epc) return alert("Please enter EPC");

  const res = await fetch(`http://localhost:8000/dpp/bottles/${epc}`);
  const resultDiv = document.getElementById('result');
  
  if (!res.ok) {
    resultDiv.innerHTML = `<div class="alert alert-danger">Bottle not found. Check EPC.</div>`;
    return;
  }

  const data = await res.json();
  const impact = data.waste_diverted_g;
  const equiv = Math.round(impact / 6.2); // ~6.2g per chip packet

  resultDiv.innerHTML = `
    <div class="card shadow-lg border-0">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0">SUSTAINABLE & VERIFIED</h4>
      </div>
      <div class="card-body">
        <h5>${data.product_name}</h5>
        <p class="text-muted">${data.variant}</p>
        <hr>
        <div class="row text-center">
          <div class="col">
            <h3 class="text-success">${impact}g</h3>
            <small>Waste Diverted</small>
          </div>
          <div class="col">
            <h3 class="text-primary">${equiv}</h3>
            <small>Chip Packets Saved</small>
          </div>
          <div class="col">
            <h3 class="text-info">${(data.confidence*100).toFixed(0)}%</h3>
            <small>AI Confidence</small>
          </div>
        </div>
        <hr>
        <p><strong>Client:</strong> ${data.client} (${data.location})</p>
        <a href="${data.qr_url}" target="_blank" class="btn btn-outline-success w-100">
          View Full Passport
        </a>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
